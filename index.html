<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Under Maintenance</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700;800&family=Barlow+Condensed:wght@700;800&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --yellow: #F5A800;
      --yellow-dark: #D48F00;
      --dark: #2E2E2E;
      --gray: #555;
      --light-bg: #F7F7F7;
      --white: #ffffff;
    }

    body {
      font-family: 'Barlow', sans-serif;
      background: var(--light-bg);
      color: var(--dark);
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: stretch;
    }

    /* ── LEFT PANEL ── */
    .left-panel {
      width: 38%;
      min-height: 100vh;
      position: relative;
      background: linear-gradient(160deg, #3a1a00 0%, #c06000 45%, var(--yellow) 100%);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
    }

    /* Yellow corner accent top-left */
    .left-panel::before {
      content: '';
      position: absolute;
      top: -30px;
      left: -30px;
      width: 160px;
      height: 160px;
      background: var(--yellow);
      border-radius: 0 0 50px 0;
      z-index: 1;
    }

    /* Gear illustration area */
    .gear-wrap {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -52%);
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .gear {
      animation: spin linear infinite;
    }
    .gear-big   { width: 200px; height: 200px; animation-duration: 8s;  }
    .gear-small { width: 110px; height: 110px; animation-duration: 5s; animation-direction: reverse; margin-left: -28px; margin-top: 65px; }

    @keyframes spin { to { transform: rotate(360deg); } }

    svg.gear path, svg.gear circle { fill: rgba(255,255,255,0.18); stroke: rgba(255,255,255,0.55); stroke-width: 3; }

    /* wrench icon in the middle */
    .wrench-icon {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-68%, -38%);
      z-index: 3;
      font-size: 52px;
      filter: drop-shadow(0 4px 12px rgba(0,0,0,0.4));
      animation: wobble 2.4s ease-in-out infinite;
    }
    @keyframes wobble {
      0%,100% { transform: translate(-68%, -38%) rotate(-12deg); }
      50%      { transform: translate(-68%, -38%) rotate(12deg); }
    }

    /* Bottom yellow rounded card bg */
    .left-panel::after {
      content: '';
      position: absolute;
      bottom: -60px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      height: 220px;
      background: var(--yellow);
      border-radius: 50% 50% 0 0 / 40px 40px 0 0;
      z-index: 1;
    }

    .panel-label {
      position: relative;
      z-index: 4;
      margin-bottom: 40px;
      text-align: center;
    }
    .panel-label span {
      display: inline-block;
      background: var(--dark);
      color: var(--yellow);
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      padding: 6px 18px;
      border-radius: 30px;
    }

    /* ── RIGHT PANEL ── */
    .right-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 60px 70px 60px 80px;
      position: relative;
    }



    /* Headline */
    .eyebrow {
      display: flex;
      align-items: center;
      gap: 18px;
      margin-bottom: 14px;
    }
    .eyebrow-line {
      width: 40px;
      height: 4px;
      background: var(--yellow);
      border-radius: 2px;
    }
    .eyebrow-text {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--yellow);
    }

    h1 {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: clamp(46px, 6vw, 76px);
      font-weight: 800;
      line-height: 1;
      color: var(--dark);
      margin-bottom: 8px;
    }
    h1 .highlight { color: var(--yellow); }

    h2 {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: clamp(26px, 3.5vw, 42px);
      font-weight: 700;
      color: var(--dark);
      margin-bottom: 28px;
    }

    p.desc {
      font-size: 16px;
      line-height: 1.75;
      color: var(--gray);
      max-width: 520px;
      margin-bottom: 36px;
    }

    /* Countdown */
    .countdown {
      display: flex;
      gap: 20px;
      margin-bottom: 40px;
    }
    .countdown-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: var(--white);
      border: 2px solid #eee;
      border-radius: 14px;
      padding: 14px 22px;
      min-width: 80px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.05);
      transition: border-color 0.2s;
    }
    .countdown-box:hover { border-color: var(--yellow); }
    .countdown-num {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 38px;
      font-weight: 800;
      color: var(--yellow);
      line-height: 1;
    }
    .countdown-lbl {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--gray);
      margin-top: 4px;
    }

    /* Progress bar */
    .progress-wrap { margin-top: 36px; max-width: 460px; }
    .progress-label {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--gray);
      margin-bottom: 8px;
    }
    .progress-label span:last-child { color: var(--yellow); }
    .progress-track {
      height: 8px;
      background: #e5e5e5;
      border-radius: 10px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--yellow-dark), var(--yellow));
      border-radius: 10px;
      transition: width 1.6s cubic-bezier(.4,0,.2,1);
    }

    /* Entrance animations */
    .fade-up {
      opacity: 0;
      transform: translateY(28px);
      animation: fadeUp 0.7s forwards;
    }
    .fade-up:nth-child(1) { animation-delay: 0.1s; }
    .fade-up:nth-child(2) { animation-delay: 0.25s; }
    .fade-up:nth-child(3) { animation-delay: 0.4s; }
    .fade-up:nth-child(4) { animation-delay: 0.55s; }
    .fade-up:nth-child(5) { animation-delay: 0.7s; }
    .fade-up:nth-child(6) { animation-delay: 0.85s; }

    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 768px) {
      body { flex-direction: column; overflow: auto; }
      .left-panel { width: 100%; min-height: 320px; }
      .right-panel { padding: 40px 28px; }
      .side-nav { display: none; }
    }
  </style>
</head>
<body>

  <!-- LEFT PANEL -->
  <div class="left-panel">
    <div class="gear-wrap">
      <!-- Big gear -->
      <svg class="gear gear-big" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <path d="M100 30 L112 10 L124 30 A72 72 0 0 1 160 54 L180 48 L188 62 L170 72 A72 72 0 0 1 170 128 L188 138 L180 152 L160 146 A72 72 0 0 1 124 170 L112 190 L100 170 A72 72 0 0 1 76 170 L64 190 L52 170 L40 146 A72 72 0 0 1 30 128 L12 138 L20 152 L38 142 L20 128 L38 118 A72 72 0 0 1 30 72 L12 62 L20 48 L40 54 A72 72 0 0 1 76 30 Z"/>
        <circle cx="100" cy="100" r="30"/>
      </svg>

      <!-- Small gear -->
      <svg class="gear gear-small" viewBox="0 0 110 110" xmlns="http://www.w3.org/2000/svg" style="position:absolute; left:calc(50% + 48px); top:calc(50% + 30px);">
        <path d="M55 18 L63 6 L71 18 A40 40 0 0 1 88 30 L100 26 L104 34 L93 40 A40 40 0 0 1 93 70 L104 76 L100 84 L88 80 A40 40 0 0 1 71 92 L63 104 L55 92 A40 40 0 0 1 39 92 L31 104 L23 92 L10 80 A40 40 0 0 1 17 70 L6 76 L10 84 L22 78 L10 70 L22 64 A40 40 0 0 1 17 40 L6 34 L10 26 L22 30 A40 40 0 0 1 39 18 Z"/>
        <circle cx="55" cy="55" r="16"/>
      </svg>
    </div>

    <div class="wrench-icon">🔧</div>

    <div class="panel-label">
      <span>We'll be back soon</span>
    </div>
  </div>

  <!-- RIGHT PANEL -->
  <div class="right-panel">
    <div class="eyebrow fade-up">
      <div class="eyebrow-line"></div>
      <span class="eyebrow-text">Site Status</span>
    </div>

    <h1 class="fade-up"><span class="highlight">Under</span></h1>
    <h2 class="fade-up">Maintenance Mode</h2>

    <p class="desc fade-up">
      We're currently performing scheduled upgrades and improvements to deliver you a
      better experience. Our team is working hard behind the scenes — we appreciate your
      patience and will be live shortly.
    </p>

    <div class="countdown fade-up" id="countdown">
      <div class="countdown-box"><span class="countdown-num" id="cd-days">00</span><span class="countdown-lbl">Days</span></div>
      <div class="countdown-box"><span class="countdown-num" id="cd-hrs">00</span><span class="countdown-lbl">Hours</span></div>
      <div class="countdown-box"><span class="countdown-num" id="cd-min">00</span><span class="countdown-lbl">Mins</span></div>
      <div class="countdown-box"><span class="countdown-num" id="cd-sec">00</span><span class="countdown-lbl">Secs</span></div>
    </div>

    <div class="progress-wrap fade-up">
      <div class="progress-label">
        <span>Progress</span>
        <span id="pct-label">72%</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="prog-fill"></div>
      </div>
    </div>
  </div>



  <script>
    // Countdown to a target date
    const target = new Date();
    target.setDate(target.getDate() + 3);
    target.setHours(target.getHours() + 5);

    function updateCountdown() {
      const now  = new Date();
      const diff = target - now;
      if (diff <= 0) return;
      const d = Math.floor(diff / 86400000);
      const h = Math.floor((diff % 86400000) / 3600000);
      const m = Math.floor((diff % 3600000)  / 60000);
      const s = Math.floor((diff % 60000)    / 1000);
      document.getElementById('cd-days').textContent = String(d).padStart(2,'0');
      document.getElementById('cd-hrs').textContent  = String(h).padStart(2,'0');
      document.getElementById('cd-min').textContent  = String(m).padStart(2,'0');
      document.getElementById('cd-sec').textContent  = String(s).padStart(2,'0');
    }
    updateCountdown();
    setInterval(updateCountdown, 1000);

    // Progress bar animation
    setTimeout(() => {
      document.getElementById('prog-fill').style.width = '72%';
    }, 900);

  </script>
</body>
</html>
